name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  Test:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test Allure.GaugePlugin.slnx -c Release

  # Catches trimming/AOT regressions that a regular build does not.
  AotPublish:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish (Native AOT)
        run: bash build.sh linux-x64
