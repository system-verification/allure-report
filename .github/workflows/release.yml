name: Release

# Push a tag matching the version in plugin.json, e.g. `git tag v1.0.1 && git push origin v1.0.1`.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  Test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify tag matches plugin version
        run: |
          VERSION=$(jq -r .version src/Allure.GaugePlugin/plugin.json)
          if [ "v$VERSION" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match plugin.json version $VERSION"
            exit 1
          fi

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test Allure.GaugePlugin.slnx -c Release

  Build:
    needs: Test
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            build: bash build.sh linux-x64
          - os: ubuntu-22.04-arm
            platform: linux-arm64
            build: bash build.sh linux-arm64
          - os: windows-latest
            platform: win-x64
            build: build.bat win-x64
          - os: windows-latest
            platform: win-arm64
            build: build.bat win-arm64
          - os: macos-latest
            platform: osx-x64
            build: bash build.sh osx-x64
          - os: macos-latest
            platform: osx-arm64
            build: bash build.sh osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: ${{ matrix.build }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: 'src/Allure.GaugePlugin/bin/Release/net10.0/${{matrix.platform}}/*.zip'
          compression-level: 0

  Release:
    needs: Build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8

      - name: Create GitHub Release
        run: |
          gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes
          gh release upload "$TAG" ./**/*.zip --clobber --repo "$REPO"
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
